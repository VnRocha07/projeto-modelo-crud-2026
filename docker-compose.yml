# Sobe o MySQL 8.4 e a API.   docker compose up --build   ->   http://localhost:8000
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: devlocal
      MYSQL_DATABASE: estoque
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      # executados em ordem alfabetica, so na PRIMEIRA subida (volume vazio)
      - ./db/mysql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - dados-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdevlocal"]
      interval: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://app:app@db:3306/estoque?charset=utf8mb4
      # "test" habilita POST /api/_test/reset, usado pelo Cypress. Ambiente de aula, nao producao.
      APP_ENV: test
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados-mysql:
