name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unitarios:
    name: Testes unitarios + integracao (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest --cov --cov-fail-under=80

  integracao-mysql:
    name: Integracao (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: devlocal
          MYSQL_DATABASE: estoque
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdevlocal"
          --health-interval=5s --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://app:app@127.0.0.1:3306/estoque?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - name: Espera o MySQL aceitar conexao TCP
        run: |
          for i in $(seq 1 30); do
            mysql -h127.0.0.1 -uapp -papp -e "SELECT 1" estoque >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "MySQL nao respondeu" && exit 1
      - name: Cria o esquema no MySQL
        run: mysql -h127.0.0.1 -uapp -papp estoque < db/mysql/01-schema.sql
      - uses: astral-sh/setup-uv@v6
      - working-directory: api
        run: uv sync && uv run pytest -m integracao
      - name: Demonstra as restricoes do banco (saidas usadas nas aulas)
        run: |
          mysql -h127.0.0.1 -uapp -papp --default-character-set=utf8mb4 estoque < db/seed.sql
          viola() {
            echo "mysql> $1"
            mysql -h127.0.0.1 -uapp -papp estoque -e "$1" && exit 1 || true
          }
          viola "INSERT INTO produto (sku, nome, preco, quantidade, categoria_id) VALUES ('ELE-001', 'Repetido', 1.00, 1, 1)"
          viola "INSERT INTO produto (sku, nome, preco, quantidade, categoria_id) VALUES ('ELE-009', 'Sem categoria', 1.00, 1, 99)"
          viola "UPDATE produto SET quantidade = -1 WHERE id = 1"
          viola "DELETE FROM categoria WHERE id = 1"

  e2e:
    name: E2E (Cypress + MySQL)
    runs-on: ubuntu-latest
    needs: [unitarios]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: devlocal
          MYSQL_DATABASE: estoque
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdevlocal"
          --health-interval=5s --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://app:app@127.0.0.1:3306/estoque?charset=utf8mb4
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Espera o MySQL aceitar conexao TCP
        run: |
          for i in $(seq 1 30); do
            mysql -h127.0.0.1 -uapp -papp -e "SELECT 1" estoque >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "MySQL nao respondeu" && exit 1
      - name: Cria esquema e seed no MySQL
        run: |
          mysql -h127.0.0.1 -uapp -papp estoque < db/mysql/01-schema.sql
          mysql -h127.0.0.1 -uapp -papp --default-character-set=utf8mb4 estoque < db/seed.sql
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
        working-directory: api
      # sem package-lock.json versionado, instalamos antes e a action so executa
      - run: npm install
        working-directory: e2e
      - name: Sobe a API em segundo plano
        working-directory: api
        run: |
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/saude && exit 0
            sleep 1
          done
          cat ../api.log && exit 1
      - uses: cypress-io/github-action@v6
        with:
          working-directory: e2e
          install: false
          config: baseUrl=http://127.0.0.1:8000
      - name: Log da API
        if: always()
        run: cat api.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: e2e/cypress/screenshots
