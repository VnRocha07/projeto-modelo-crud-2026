name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unitarios:
    name: Testes unitarios + integracao (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest --cov --cov-fail-under=80

  integracao-mysql:
    name: Integracao (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: devlocal
          MYSQL_DATABASE: estoque
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdevlocal"
          --health-interval=5s --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://app:app@127.0.0.1:3306/estoque?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - name: Espera o MySQL aceitar conexao TCP
        run: |
          for i in $(seq 1 30); do
            mysql -h127.0.0.1 -uapp -papp -e "SELECT 1" estoque >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "MySQL nao respondeu" && exit 1
      - name: Cria o esquema no MySQL
        run: mysql -h127.0.0.1 -uapp -papp estoque < db/mysql/01-schema.sql
      - uses: astral-sh/setup-uv@v6
      - working-directory: api
        run: uv sync && uv run pytest -m integracao
      - name: Demonstra a restricao UNIQUE (saida usada no INTENSIVO.md)
        run: |
          mysql -h127.0.0.1 -uapp -papp --default-character-set=utf8mb4 estoque < db/seed.sql
          mysql -h127.0.0.1 -uapp -papp estoque -e \
            "INSERT INTO produto (sku, nome, preco, quantidade, categoria_id) VALUES ('ELE-001', 'Repetido', 1.00, 1, 1)" \
            && exit 1 || true

  e2e:
    name: E2E (Cypress + MySQL)
    runs-on: ubuntu-latest
    needs: [unitarios]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: devlocal
          MYSQL_DATABASE: estoque
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdevlocal"
          --health-interval=5s --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://app:app@127.0.0.1:3306/estoque?charset=utf8mb4
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Espera o MySQL aceitar conexao TCP
        run: |
          for i in $(seq 1 30); do
            mysql -h127.0.0.1 -uapp -papp -e "SELECT 1" estoque >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "MySQL nao respondeu" && exit 1
      - name: Cria esquema e seed no MySQL
        run: |
          mysql -h127.0.0.1 -uapp -papp estoque < db/mysql/01-schema.sql
          mysql -h127.0.0.1 -uapp -papp --default-character-set=utf8mb4 estoque < db/seed.sql
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
        working-directory: api
      - uses: cypress-io/github-action@v6
        with:
          working-directory: e2e
          install-command: npm install
          start: uv run --directory ../api uvicorn app.main:app --port 8000
          wait-on: http://localhost:8000/api/saude
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: e2e/cypress/screenshots
